name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Package tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(); Pkg.test(; test_args=["--jobs=2", "--verbose"])'

  scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Scientific witnesses
        run: julia --project=test/scientific_witnesses --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(); include("test/scientific_witnesses/runtests.jl")'

  macos-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Public API and KernelAbstractions smoke tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(); Pkg.test(; test_args=["--jobs=1", "test_public_api", "test_direct_pointwise_stage"])'

  macos-package:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Complete macOS package tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(); Pkg.test(; test_args=["--jobs=2"])'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Documentation
        run: julia --project=docs --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(); include("docs/make.jl")'

  metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Metal qualification
        run: julia --project=test/metal --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(); include("test/metal/runtests.jl")'
